<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>T2 | حلول التسويق الرقمي</title>
  <meta name="description" content="T2 شركة تسويق رقمي متكاملة: سوشيال ميديا، مواقع، فيديوهات بالذكاء الاصطناعي، إعلانات، وإدارة صفحات.">
  <meta name="theme-color" content="#14213d">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <style>
    .cdd { position: relative; }
    .cdd-btn { display:flex; align-items:center; gap:8px; padding:8px 14px; min-width:150px; border:1px solid var(--line); background:#fff; border-radius:999px; font:inherit; font-size:14px; color:var(--navy); cursor:pointer; justify-content:space-between; }
    .cdd-btn:hover, .cdd-btn:focus-visible { border-color:var(--gold); outline:none; }
    .cdd-btn .flag { font-size:18px; line-height:1; }
    .cdd-btn .label { flex:1; text-align:start; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cdd-btn .caret { font-size:10px; color:var(--muted); transition:transform .2s; }
    .cdd.open .cdd-btn .caret { transform:rotate(180deg); }
    .cdd-btn.pulse { animation:pulse 1.8s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(201,162,39,.55)} 70%{box-shadow:0 0 0 10px rgba(201,162,39,0)} 100%{box-shadow:0 0 0 0 rgba(201,162,39,0)} }
    .cdd-list { position:absolute; top:calc(100% + 10px); inset-inline-end:0; width:min(260px,86vw); max-height:340px; overflow:auto; margin:0; padding:8px; list-style:none; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 18px 40px rgba(20,33,61,.18); z-index:60; opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .2s, transform .2s; }
    .cdd.open .cdd-list { opacity:1; transform:none; pointer-events:auto; }
    .cdd-list li { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink); }
    .cdd-list li .flag { font-size:20px; line-height:1; }
    .cdd-list li.active, .cdd-list li:hover { background:#f4f1e8; }
    .cdd-list li[aria-selected="true"] { color:var(--navy); font-weight:700; }
    .cdd-list li[aria-selected="true"]::after { content:"✓"; margin-inline-start:auto; color:var(--gold); }

    .hero-3d { width:min(460px,80vw); aspect-ratio:1; position:relative; }
    .hero-3d canvas { width:100% !important; height:100% !important; display:block; }
    .hero-3d img.fallback { width:100%; height:100%; object-fit:contain; animation:float 6s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    @media (max-width:900px) { .hero-3d { width:min(320px,72vw); } }
  </style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="T2"><img src="logo.png" alt="T2"></a>
    <nav class="nav" id="nav" aria-label="main">
      <a href="#services" data-i="nav_services"></a>
      <a href="#portfolio" data-i="nav_portfolio"></a>
      <a href="#all" data-i="nav_all"></a>
      <a href="#quote" data-i="nav_quote"></a>
    </nav>
    <div class="header-actions">
      <div class="cdd" id="cdd">
        <button class="cdd-btn" id="cdd-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="cdd-list">
          <span class="flag">🌍</span><span class="label"></span><span class="caret">▼</span>
        </button>
        <ul class="cdd-list" id="cdd-list" role="listbox"></ul>
      </div>
      <button class="chip" id="btn-lang" type="button"></button>
      <button class="menu-btn" id="btn-menu" type="button" aria-label="menu" aria-expanded="false">☰</button>
    </div>
  </div>
</header>

<main>
  <section class="hero" id="top">
    <div class="wrap">
      <div>
        <h1 data-i="hero_title"></h1>
        <p class="lead" data-i="hero_lead"></p>
        <div class="cta-row">
          <a class="btn primary" href="#quote" data-i="hero_cta"></a>
          <a class="btn ghost" href="#portfolio" data-i="hero_secondary"></a>
        </div>
      </div>
      <div class="hero-logo">
        <div class="hero-3d" id="hero-3d"><img class="fallback" src="logo.png" alt="T2"></div>
      </div>
    </div>
  </section>

  <section id="services">
    <div class="wrap">
      <h2 data-i="services_title"></h2>
      <p class="section-lead" data-i="services_lead"></p>
      <ul class="pick-list" id="services-list"></ul>
    </div>
  </section>

  <section id="portfolio" style="background:#fbfaf6">
    <div class="wrap">
      <h2 data-i="portfolio_title"></h2>
      <p class="section-lead" data-i="portfolio_lead"></p>
      <div id="portfolio-wrap"></div>
    </div>
  </section>

  <section id="all">
    <div class="wrap">
      <h2 data-i="all_title"></h2>
      <p class="section-lead" data-i="all_lead"></p>
      <div class="groups" id="groups"></div>
    </div>
  </section>

  <section id="quote" class="quote">
    <div class="wrap">
      <h2 data-i="quote_title"></h2>
      <p class="section-lead" data-i="quote_lead"></p>
      <form class="form" id="quote-form" novalidate>
        <div class="sel-summary" id="sel-summary"></div>
        <label for="pkg" data-i="f_pkg"></label>
        <select id="pkg">
          <option value="basic" data-i="pkg_basic"></option>
          <option value="pro" data-i="pkg_pro"></option>
          <option value="full" data-i="pkg_full"></option>
        </select>
        <div class="row">
          <div>
            <label for="name" data-i="f_name"></label>
            <input id="name" autocomplete="name" required>
          </div>
          <div>
            <label for="biz" data-i="f_biz"></label>
            <input id="biz" autocomplete="organization">
          </div>
        </div>
        <label for="phone" data-i="f_phone"></label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" required>
        <label for="notes" data-i="f_notes"></label>
        <textarea id="notes"></textarea>
        <p class="err" id="form-err"></p>
        <button class="btn primary" type="submit" data-i="f_submit"></button>
        <p class="note" data-i="f_note"></p>
      </form>
    </div>
  </section>
</main>

<div class="order-bar" id="order-bar" hidden>
  <span id="order-count"></span>
  <a class="btn primary" id="order-go" href="#quote" data-i="order_go"></a>
</div>

<footer>
  <div class="wrap">
    <span>© T2 · <span data-i="footer_rights"></span></span>
    <a id="footer-wa" href="https://wa.me/201090960743" target="_blank" rel="noopener" data-i="footer_contact"></a>
  </div>
</footer>

<div class="modal" id="video-modal" hidden role="dialog" aria-modal="true">
  <div class="player">
    <button class="close" id="video-close" type="button" aria-label="close">✕</button>
    <video id="video-player" controls playsinline></video>
    <p class="msg" id="video-msg" hidden></p>
  </div>
</div>

<script src="i18n.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
